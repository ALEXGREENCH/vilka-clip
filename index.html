<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вилка — сюжетный монтаж</title>
<style>
:root{color-scheme:dark;--paper:#eee9df;--muted:#8d939e;--accent:#ff7a55}*{box-sizing:border-box}body{margin:0;background:#0b0c10;color:var(--paper);font:15px system-ui,sans-serif}main{max-width:1440px;padding:25px 30px 22px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:20px}h1{font-size:29px;letter-spacing:8px;margin:0;font-weight:850}header p{font-size:10px;letter-spacing:2px;color:var(--muted);margin:6px 0 0}.edition{font:10px monospace;letter-spacing:2px;text-align:right;color:#babfc9}.edition b{display:block;margin-bottom:5px;font-size:12px;font-weight:400;color:var(--accent)}.screen{background:#000;position:relative;box-shadow:0 10px 65px #0006;line-height:0}canvas{display:block;width:100%;aspect-ratio:16/9;max-height:73vh;object-fit:contain}.screen:fullscreen{display:flex;align-items:center;justify-content:center;width:100vw;height:100vh}.screen:fullscreen canvas{max-height:100vh;width:100%;height:100%;object-fit:contain}.ribbon{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #292b33;padding:12px 0;color:#b8bcc6;font:11px monospace;letter-spacing:.4px}#lookName{color:#f0eade}#cutNumber{color:var(--accent)}.transport{display:flex;align-items:center;gap:10px;margin:17px 0}button,select{background:#17191f;color:var(--paper);border:1px solid #353840;font:inherit;border-radius:3px;padding:10px 13px}button{cursor:pointer}button:hover,select:hover{border-color:#939799}button:disabled{opacity:.45;cursor:wait}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #ffad8c;outline-offset:3px}#play{background:var(--paper);color:#171719;border-color:var(--paper);min-width:127px;font-weight:650}#seek{flex:1;min-width:60px;accent-color:var(--accent)}#clock{font:12px monospace;min-width:98px;color:#aaaeb8}.settings{display:flex;gap:18px;align-items:end;flex-wrap:wrap;border-top:1px solid #25272f;padding-top:15px}.settings label{display:flex;flex-direction:column;gap:6px;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}.settings select{font-size:12px;text-transform:none;letter-spacing:0;max-width:320px;min-width:170px}footer{font-size:11px;line-height:1.7;color:#777e8b;margin-top:18px;display:flex;justify-content:space-between;gap:20px}#notice{color:#e8aa7f}.brand{color:#bbb7b0}#boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;line-height:1.5;background:#090b12;color:#c9c8c0;font:13px monospace}#boot[hidden]{display:none}@media(max-width:750px){main{padding:17px 13px}h1{font-size:24px}.edition{font-size:8px}.transport{flex-wrap:wrap}#seek{order:5;flex-basis:75%}.settings{gap:10px}.settings select{min-width:130px;max-width:280px}#clock{margin-left:auto}.ribbon{font-size:10px}footer{display:block}.world-nav{padding:10px}}
</style></head><body><main>
<header><div><h1>ВИЛКА</h1><p>ОДИН ОРИГИНАЛ / ТЫСЯЧА КОПИЙ</p></div><div class="edition"><b>32 МИРА / ОДНА ИСТОРИЯ</b>МОНТАЖ ПО ТЕКСТУ ПЕСНИ</div></header>
<div class="screen" id="frame"><canvas id="screen" width="1280" height="720" aria-label="Клип Вилка: непрерывная смена визуальных миров"></canvas><div id="boot">Собираем миры…</div></div>
<div class="ribbon"><span id="lookName">Вилка</span><span><span id="cutNumber">001</span> / <span id="cutTotal">58</span></span></div>
<audio id="audio" src="assets/song.mp3" preload="auto"></audio>
<div class="transport"><button id="play" disabled>Загрузка…</button><button class="world-nav" id="prev" aria-label="Предыдущий мир" title="Предыдущий мир">←</button><button class="world-nav" id="next" aria-label="Следующий мир" title="Следующий мир">→</button><input id="seek" type="range" min="0" max="255" step=".01" value="0" aria-label="Позиция в клипе"><span id="clock">0:00 / 4:15</span><button id="full">На весь экран</button></div>
<div class="settings"><label>Монтаж<select id="styles" aria-label="Визуальный стиль"><option value="-1">Сюжетный монтаж</option></select></label><label>Сцена<select id="chapters" aria-label="Сцена"></select></label><label>Детализация<select id="quality" aria-label="Детализация"><option value="auto">Сбалансированная</option><option value="high">Высокая</option><option value="low">Экономная</option></select></label><button id="compare" aria-pressed="false" title="Переключить обработку материалов, света и краёв">Сравнить с исходником</button></div>
<footer><span>Кино, игры, живопись и невозможные пространства.<br><span class="brand">Полная песня · 4:15</span></span><span id="notice">Пробел — воспроизведение · ← → — смена мира</span></footer>
</main><script src="procedural-worlds.js"></script><script src="procedural-games.js"></script><script src="procedural-shaders.js"></script><script src="procedural-finish.js"></script><script src="procedural-story.js"></script><script src="procedural-narrative.js"></script><script src="procedural-director.js"></script>
<script>
'use strict';
const canvas=document.querySelector('#screen'),audio=document.querySelector('#audio'),play=document.querySelector('#play'),seek=document.querySelector('#seek'),clock=document.querySelector('#clock'),styles=document.querySelector('#styles'),chapters=document.querySelector('#chapters'),quality=document.querySelector('#quality'),lookName=document.querySelector('#lookName'),cutNumber=document.querySelector('#cutNumber'),notice=document.querySelector('#notice'),boot=document.querySelector('#boot');
let director=null,lastFrame=-1,lastDraw=0,force=true,lastStyle=-1,drawCount=0,drawCost=0;
const format=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
function jump(t){audio.currentTime=Math.min(254.99,Math.max(0,t));force=true}
function paint(now){if(director){const t=audio.currentTime,frame=Math.floor(t*30);if(force||(!audio.paused&&frame!==lastFrame&&now-lastDraw>=24)){
 const begin=performance.now(),state=director.render(t);drawCost+=performance.now()-begin;drawCount++;lastDraw=now;lastFrame=frame;force=false;
 if(state.id!==lastStyle){lookName.textContent=state.name;lastStyle=state.id}cutNumber.textContent=String(state.cut+1).padStart(3,'0');seek.value=t;clock.textContent=format(t)+' / 4:15';canvas.dataset.style=state.id;canvas.dataset.cut=state.cut;canvas.dataset.scene=state.scene;canvas.dataset.gpu=state.gpu;canvas.dataset.finish=state.finish;canvas.dataset.materials=state.materials;canvas.dataset.sourceWidth=state.sourceWidth;canvas.dataset.errors=[...state.errors,director.gpu.error||'',director.post.error||''].filter(Boolean).join(' | ');canvas.dataset.meanRenderMs=(drawCost/drawCount).toFixed(1);
 if(canvas.dataset.errors)notice.textContent='Некоторые сцены работают в упрощённом режиме.';
 }}requestAnimationFrame(paint)}
Promise.all([fetch('timeline.json').then(r=>{if(!r.ok)throw Error('Таймлайн недоступен');return r.json()}),fetch('out/energy.json').then(r=>{if(!r.ok)throw Error('Данные песни недоступны');return r.json()})]).then(([timeline,energy])=>{
 director=VilkaProcedural.init({canvas,worlds:VilkaWorlds,games:VilkaGames,shaders:VilkaShaders,finish:VilkaFinish,story:VilkaStory,narrative:VilkaNarrative,timeline,energy,createCanvas:(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c}});
 for(const s of director.catalog){const option=document.createElement('option');option.value=s.id;option.textContent=s.name;styles.append(option)}
 for(const q of timeline.filter(q=>q.chapter)){const option=document.createElement('option');option.value=q.start;option.textContent=format(q.start)+' · '+q.chapter;chapters.append(option)}
 if(!director.gpu.available||!director.post.available)notice.textContent='Часть эффектов работает в упрощённом режиме.';
 document.querySelector('#cutTotal').textContent=VilkaStory.shots.length;boot.hidden=true;play.disabled=false;play.textContent='Смотреть';requestAnimationFrame(paint);
}).catch(error=>{boot.textContent='Не удалось загрузить клип. Обновите страницу.';notice.textContent=error.message;console.error(error)});
play.onclick=async()=>{try{if(audio.ended)jump(0);if(audio.paused){await audio.play();play.textContent='Пауза';force=true}else{audio.pause();play.textContent='Смотреть'}}catch(error){notice.textContent='Звук не запустился: '+error.message}};
seek.oninput=()=>jump(+seek.value);chapters.onchange=()=>jump(+chapters.value);styles.onchange=()=>{director.setStyle(+styles.value);lastStyle=-1;force=true};quality.onchange=()=>{director.setQuality(quality.value);force=true};
document.querySelector('#compare').onclick=e=>{const raw=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',String(raw));e.currentTarget.textContent=raw?'Вернуть обработку':'Сравнить с исходником';director.setMaterials(!raw);force=true};
document.querySelector('#prev').onclick=()=>jump((VilkaStory.cueAt(audio.currentTime).prev?.start||0)+.01);document.querySelector('#next').onclick=()=>jump((VilkaStory.cueAt(audio.currentTime).next?.start||254.9)+.01);
document.querySelector('#full').onclick=async()=>{if(document.fullscreenElement)await document.exitFullscreen();else await document.querySelector('#frame').requestFullscreen()};
audio.onended=()=>{play.textContent='Смотреть ещё раз';force=true};audio.onseeked=()=>force=true;
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,button'))return;if(e.code==='Space'){e.preventDefault();play.click()}else if(e.code==='ArrowRight'){e.preventDefault();document.querySelector('#next').click()}else if(e.code==='ArrowLeft'){e.preventDefault();document.querySelector('#prev').click()}});
</script></body></html>
